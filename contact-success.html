<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Received — Jerry Moo Kee Khong</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .success-container {
      max-width: 680px;
      margin: 80px auto 40px;
      padding: 40px 28px;
      background: var(--paper-card-solid);
      border: var(--border-width) solid var(--border);
      border-radius: var(--hand);
      box-shadow: var(--shadow-hover);
      text-align: center;
    }
    .go-back-btn {
      margin-top: 24px;
    }
    .go-back-btn a {
      display: inline-block;
      color: var(--paper);
      background-color: var(--ink);
      padding: 12px 24px;
      text-decoration: none !important;
      font-family: 'Permanent Marker', cursive, sans-serif;
      font-size: 1.15rem;
      border: var(--border-width) solid var(--border);
      border-radius: var(--hand-alt);
      box-shadow: 4px 4px 0px var(--shadow-color);
      transition: all var(--transition-fast);
    }
    .go-back-btn a:hover,
    .go-back-btn a:focus-visible {
      background-color: var(--blue);
      color: #FFFFFF;
      outline: 3px solid var(--blue);
      outline-offset: 3px;
      box-shadow: 6px 6px 0px var(--shadow-color);
      transform: translate(-2px, -2px);
    }
  </style>
</head>
<body>

  <div class="success-container">
    <div style="font-size:3rem;margin-bottom:12px;">🎉</div>
    <h1 style="color:var(--blue);font-size:2.4rem;">Thanks for reaching out!</h1>
    <p style="font-size:1.15rem;margin-top:12px;">Your message has been received. I'll get back to you as soon as possible.</p>
    
    <div class="go-back-btn">
      <a href="index.html">Return to Portfolio Homepage ➜</a>
    </div>
  </div>

  <!-- UI Diagnostic Test Runner for contact-success.html?test=1 -->
  <script>
    (function () {
      const qs = new URLSearchParams(location.search);
      if (qs.get("test") !== "1") return;
      
      function show(results) {
        const d = document.createElement("div");
        d.style.position = "fixed";
        d.style.right = "16px";
        d.style.bottom = "16px";
        d.style.zIndex = "4000";
        d.style.background = "rgba(15,23,42,0.92)";
        d.style.color = "#fff";
        d.style.padding = "12px 16px";
        d.style.borderRadius = "12px";
        d.style.fontFamily = "Lexend, Arial, sans-serif";
        d.style.fontSize = "14px";
        d.style.boxShadow = "0 8px 24px rgba(0,0,0,0.4)";
        const pass = results.filter((r) => r.pass).length;
        const fail = results.length - pass;
        d.textContent = `UI tests: ${pass} passed, ${fail} failed`;
        document.body.appendChild(d);
      }
      
      function has(sel) {
        return !!document.querySelector(sel);
      }
      
      function attr(el, a) {
        return el && el.getAttribute(a);
      }
      
      async function run() {
        const results = [];
        results.push({
          name: "Lexend font link",
          pass: has('link[href*="fonts.googleapis.com"][href*="Lexend"]'),
        });
        const h1 = document.querySelector("h1");
        results.push({
          name: "Heading text",
          pass: h1 && h1.textContent.trim().length > 0,
        });
        const link = document.querySelector(".go-back-btn a");
        results.push({
          name: "Go back link href",
          pass: link && (attr(link, "href") === "index.html" || attr(link, "href") === "https://jerrymoo.com"),
        });
        if (link) {
          link.focus();
          await new Promise((r) => setTimeout(r, 50));
          const cs = getComputedStyle(link);
          results.push({
            name: "Focus outline visible",
            pass: parseFloat(cs.outlineWidth) >= 2 || parseFloat(cs.boxShadow) !== 0,
          });
        }
        show(results);
      }
      run();
    })();
  </script>
  <script src="js/main.js"></script>
</body>
</html>
